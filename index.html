<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>%APP_TITLE%</title>
    <!-- Shared by the initial HTML and PageLoading; available before application scripts or styles load. -->
    <style>
      .app-boot-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        overflow: auto;
        padding: 24px;
        background: #fff;
        color: #171717;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }

      .app-boot-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        max-width: 100%;
      }

      .app-loading-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        color: var(--primary, #2563eb);
      }

      .app-boot-screen .app-loading-dots {
        color: #2563eb;
      }

      .app-loading-dots > span {
        width: 6px;
        height: 6px;
        flex: none;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.3;
        animation: app-loading-pulse 1.4s ease-in-out infinite;
      }

      .app-loading-dots > span:nth-child(2) {
        animation-delay: 0.16s;
      }

      .app-loading-dots > span:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes app-loading-pulse {
        0%,
        60%,
        100% {
          opacity: 0.3;
        }
        30% {
          opacity: 1;
        }
      }

      .app-boot-title {
        margin: 0;
        font-size: 16px;
        font-weight: 500;
        line-height: 24px;
        letter-spacing: 0.02em;
        overflow-wrap: anywhere;
      }

      .app-boot-message {
        margin: 6px 0 0;
        color: #737373;
        font-size: 12px;
        line-height: 20px;
      }

      .app-boot-retry {
        min-height: 44px;
        padding: 8px 20px;
        border: 1px solid currentColor;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .app-boot-retry:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 4px;
      }

      @media (prefers-color-scheme: dark) {
        .app-boot-screen {
          background: #0a0a0a;
          color: #fafafa;
        }

        .app-boot-screen .app-loading-dots {
          color: #60a5fa;
        }

        .app-boot-message {
          color: #a3a3a3;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading-dots > span {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot-screen" role="status" aria-live="polite" aria-label="正在加载应用…">
        <div class="app-boot-content">
          <div class="app-loading-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div>
            <h1 class="app-boot-title">%APP_TITLE%</h1>
            <p class="app-boot-message">正在加载应用…</p>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <style>
        #app {
          display: none;
        }
      </style>
      <div class="app-boot-screen" role="alert">请启用 JavaScript 后刷新页面。</div>
    </noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
