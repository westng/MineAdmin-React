name: Public framework checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framework:
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Locked dependency install
        run: pnpm install --frozen-lockfile
      - name: TypeScript, lint and format
        run: pnpm run check
      - name: Component closure and framework behavior
        run: pnpm run check:framework
      - name: Application bootstrap with network blocked
        run: pnpm run check:bootstrap
      - name: Public source build smoke
        run: pnpm run build:public-smoke
      - name: Public repository content gate
        run: pnpm run check:public-index
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
